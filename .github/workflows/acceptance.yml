---
name: Acceptance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: DollarBox Acceptance
    runs-on: ubuntu-latest
    environment: dollarbox-acceptance
    timeout-minutes: 120
    env:
      TF_ACC: "1"
      DOLLARBOX_TOKEN: ${{ secrets.DOLLARBOX_TOKEN }}
      DOLLARBOX_ORG: ${{ secrets.DOLLARBOX_ORG }}
      DOLLARBOX_ENDPOINT: ${{ secrets.DOLLARBOX_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Validate acceptance secrets
        run: |
          if [ -z "$DOLLARBOX_TOKEN" ]; then
            echo "::error::DOLLARBOX_TOKEN secret is required for acceptance tests"
            exit 1
          fi
          if [ -z "$DOLLARBOX_ORG" ]; then
            echo "::error::DOLLARBOX_ORG secret is required for acceptance tests"
            exit 1
          fi

      - name: Run acceptance tests
        run: make testacc
